
name: SO2HEAD APK BUILDER

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: SO2HEAD Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html style.css script.js www/

      - name: Create Package
        run: |
          cat > package.json <<'EOF'
          {
            "name": "so2head",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo SO2HEAD ready"
            },
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          npm install

      - name: Initialize Capacitor
        run: |
          npx cap init SO2HEAD com.so2head.app --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SO2HEAD APK
        uses: actions/upload-artifact@v4
        with:
          name: SO2HEAD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
