<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#252525">
<title>S2 Head Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">S2 <span>HEAD CONTROL</span></div>
    <div class="version">V1.0</div>
  </header>
  <main>
    <div class="preview-title">CHARACTER PREVIEW</div>
    <div class="character">
      <svg viewBox="0 0 240 340" id="soldier" role="img" aria-label="Demo karakter">
        <path d="M86 210 L72 300 L104 300 L117 220Z" fill="#b47b4c"/>
        <path d="M123 220 L137 300 L168 300 L151 210Z" fill="#c18a57"/>
        <path d="M72 294 L105 294 L112 321 L61 321Z" fill="#242424"/>
        <path d="M137 294 L168 294 L181 321 L139 321Z" fill="#242424"/>
        <path d="M83 126 L55 194 L72 208 L105 147Z" fill="#b47b4c"/>
        <path d="M151 126 L183 193 L167 208 L135 147Z" fill="#b47b4c"/>
        <path d="M83 116 L151 116 L164 225 L75 225Z" fill="#354b4b"/>
        <path d="M91 127 L143 127 L151 193 L85 193Z" fill="#53635c"/>
        <path d="M100 137 L140 137 L145 184 L94 184Z" fill="#303a38"/>
        <rect x="105" y="88" width="29" height="38" rx="8" fill="#c18a57"/>
        <g id="head">
          <ellipse cx="120" cy="66" rx="31" ry="39" fill="#c18a57"/>
          <path d="M89 65 Q84 26 119 27 Q155 25 151 66 L141 49 Q118 37 95 52Z" fill="#242424"/>
          <path d="M99 69 L110 68 M130 68 L141 69" stroke="#222" stroke-width="4" stroke-linecap="round"/>
          <path d="M110 91 Q120 98 132 90" stroke="#51372c" stroke-width="3" fill="none"/>
          <path d="M114 77 L126 77" stroke="#714b35" stroke-width="2"/>
        </g>
      </svg>
    </div>
    <section class="panel">
      <div class="panel-heading">
        <span>HEAD SIZE</span>
        <span id="sizeValue">100%</span>
      </div>
      <input type="range" id="headSlider" min="70" max="280" value="100" aria-label="Demo kafa boyutu">
      <div class="range-labels"><span>SMALL</span><span>DEFAULT</span><span>BIG</span></div>
    </section>
    <button id="startButton" type="button">▶ START GAME</button>
    <div id="status" role="status">● SYSTEM READY</div>
  </main>
  <footer>S2 HEAD CONTROL <span>•</span> MOBILE EDITION</footer>
</div>
<script src="script.js"></script>
</body>
</html>
